# Production deploy — NestJS API → Contabo VPS (doc 23 §3 "API release").
#
# TRIGGERS:
#   push -> main        : happy path — a merged dev->main promotion or hotfix PR.
#   pull_request:closed : the merged-PR FALLBACK (deploy-fallback.yml) dispatches this
#                         workflow via workflow_dispatch with target_sha, because the
#                         push->main event is intermittently dropped by GitHub (proven in
#                         the runbook). Both converge on this exact-SHA path.
#   workflow_dispatch   : manual recovery / the fallback dispatcher (optional target_sha).
# No tag trigger and no scheduled reconciliation: a schedule can itself be delayed or
# dropped, so it would not close the observed event gap (owner Option 4). Direct pushes to
# main are refused by the repository ruleset and prohibited by policy.
#
# MANUAL APPROVAL GATE: the `deploy` job below — the only job here that
# mutates the server — is bound to the `production` environment, so every path pauses
# for the owner's approval before the first remote write. See that job for the full
# rationale and the environment's settings.
#
# EXACT-SHA + IDEMPOTENCY: `preflight` resolves the target SHA (push -> github.sha;
# workflow_dispatch -> target_sha, which must equal github.sha), asserts it is the current
# main tip, and reads the live release SHA over SSH. Successful preflight outcomes are
# release / already-current / superseded; invalid refs and lookup failures abort closed.
# verify + e2e + deploy run ONLY when action == release, so a
# same-SHA push+fallback pair is idempotent (one deploys; the queued one no-ops at
# preflight). The whole workflow shares one concurrency group so only one path mutates the
# server, and the deploy job re-checks github.sha == current main immediately before any
# mutation. A `[skip ci]` on a main commit must never be used.
#
# ROLLBACK (no rebuild — doc 23 §3): the deploy auto-rolls-back (repoint `current` at the
# previous release + restart) if the post-cutover health gate fails. Manual form:
#     ln -sfn /srv/eslammuatamed-api/releases/<previous> /srv/eslammuatamed-api/current.new
#     mv -Tf  /srv/eslammuatamed-api/current.new /srv/eslammuatamed-api/current
#     sudo systemctl restart eslammuatamed-api
#   Then re-run the SAME acceptance checks against the release you rolled back to — the
#   automatic path does exactly that (`verify_app` in scripts/deploy/remote-cutover.sh).
#   A restarted process is not a verified rollback.
#   Migrations are fix-forward (doc 09 §6); rolling the symlink back does NOT roll the
#   schema back. Database restore (doc 23 §4) is the disaster path only.
#
# SERVER LAYOUT (full contract in the deploy runbook):
#   /srv/eslammuatamed-api/releases/<id>   extracted release (id = <UTC-ts>-<short-sha>)
#   /srv/eslammuatamed-api/shared/.env     secrets, server-side only — never in a release
#   /srv/eslammuatamed-api/current         symlink → the live release
#   systemd unit: eslammuatamed-api  ·  deploy user: scoped sudoers for the restart only.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact main commit SHA to deploy (must equal current main). Empty = current main.'
        required: false
        type: string

# One production deployment at a time across EVERY path (push + fallback dispatch); an
# in-flight deploy must finish (never cancel a cutover). The queued path no-ops at preflight.
concurrency:
  group: deploy-api-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Resolve + validate the exact target SHA and decide the action. Runs first (after
  # acquiring the concurrency slot), reads the live release SHA over SSH, and short-circuits
  # already-current / superseded so the second path of a same-SHA pair is a cheap no-op.
  preflight:
    name: Preflight — resolve & validate exact SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      action: ${{ steps.pf.outputs.action }}
      sha: ${{ steps.pf.outputs.sha }}
      trigger: ${{ steps.pf.outputs.trigger }}
    steps:
      - name: Write deploy key + pin host key (read-only preflight use)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"; chmod 600 "$HOME/.ssh/deploy_key"
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "DEPLOY_KNOWN_HOSTS secret is empty" >&2; exit 1; }
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Resolve trigger, validate SHA == current main, check already-current
        id: pf
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          TARGET_INPUT: ${{ github.event.inputs.target_sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          echo "trigger=$EVENT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploy preflight"
            echo "- trigger: \`$EVENT\`"
            echo "- source branch: \`$REF\`"
            echo "- source/target SHA: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # Production is main only.
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::ref '$REF' is not refs/heads/main."
            echo "action=abort" >> "$GITHUB_OUTPUT"; exit 1
          fi
          # A dispatched target_sha (from the merged-PR fallback) must match github.sha
          # exactly — never deploy a stale/mismatched SHA.
          if [ -n "${TARGET_INPUT:-}" ] && [ "$TARGET_INPUT" != "$SHA" ]; then
            echo "target_sha ($TARGET_INPUT) != github.sha ($SHA) — superseded."
            echo "- result: **superseded** (target_sha != github.sha)" >> "$GITHUB_STEP_SUMMARY"
            echo "action=superseded" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # github.sha must be the current main tip. Resolve it from the GIT backend
          # (ls-remote), NOT the REST API: during GitHub incidents the REST replica can
          # lag or 503 while the git backend stays healthy (observed 2026-07-20 — both
          # trigger runs failed on this very lookup in the web repo). Retries ride out blips.
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          MAIN=""
          for attempt in 1 2 3 4 5; do
            if MAIN="$(git -c http.extraHeader="$AUTH" ls-remote "https://github.com/${REPO}.git" refs/heads/main 2>/dev/null | cut -f1)" && [ -n "$MAIN" ]; then
              break
            fi
            echo "main-tip lookup attempt $attempt failed; retrying in $((attempt * 5))s..."
            sleep "$((attempt * 5))"
          done
          if [ -z "$MAIN" ]; then
            echo "::error::could not resolve the current main tip from the git backend."
            echo "action=abort" >> "$GITHUB_OUTPUT"; exit 1
          fi
          if [ "$SHA" != "$MAIN" ]; then
            echo "github.sha ($SHA) != current main ($MAIN) — superseded."
            echo "- result: **superseded** (github.sha != current main)" >> "$GITHUB_STEP_SUMMARY"
            echo "action=superseded" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Already live? Read the live release id (<ts>-<short7sha>) and compare the sha.
          LIVE="$(ssh -i "$HOME/.ssh/deploy_key" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" \
            'readlink -f /srv/eslammuatamed-api/current 2>/dev/null | sed "s#.*/##"' | sed 's/^.*-//' || true)"
          echo "live release short SHA: '${LIVE:-none}'  target short SHA: '${SHA:0:7}'"
          if [ -n "$LIVE" ] && [ "$LIVE" = "${SHA:0:7}" ]; then
            echo "- result: **already current** (\`$LIVE\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "action=already-current" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # action value MUST NOT contain the string that is the DEPLOY_USER secret ("deploy"):
          # GitHub masks any output value containing a secret and drops the output entirely,
          # which would make every gated job skip. Use "release" (see the if: conditions).
          echo "- decision: **release** (currently live: \`${LIVE:-none}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "action=release" >> "$GITHUB_OUTPUT"

  # Release gate — mirrors ci.yml `verify`. Runs only for a real deploy.
  verify:
    name: Lint · Typecheck · Unit · Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: preflight
    if: needs.preflight.outputs.action == 'release'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Present in ci.yml's verify job but previously ABSENT here, which is the direction that
      # matters: this job is a `needs:` gate on the production deploy, so the release path was the
      # one lane that could ship a migration destroying the FTS index/column (D09-6/D02-3) after
      # PR CI had already approved the branch. Pure filesystem check over prisma/migrations — no
      # database, so it needs no service container in this job.
      - name: FTS migration guard (protects article search — D09-6/D02-3)
        run: npm run guard:fts

      - name: Unit tests
        run: npm test

      - name: Export OpenAPI contract (no database)
        run: cp .env.example .env && npm run contract:export

      - name: Enforce OpenAPI contract idempotence
        run: |
          if git show HEAD:openapi.json | diff -u - openapi.json; then
            echo "openapi.json is a fixed point of contract:export."
          else
            echo "::error::Committed openapi.json is stale — run 'npm run contract:export' and commit the result." >&2
            exit 1
          fi

  # Integration gate — Postgres 16 + migrations + seed + the e2e suite. Runs only for a deploy.
  #
  # Deliberately NOT `needs: verify` — unlike ci.yml, where that ordering is correct. The two
  # lanes face different odds and pay different costs:
  #
  #   ci.yml runs on every PR and every dev push, where a failing `verify` is ordinary, so
  #   gating e2e on it avoids spinning up Postgres for a tree that already failed lint.
  #
  #   This workflow runs only on a release, on a tree that already passed the full ci.yml
  #   `verify` on the dev push. A failing `verify` here is the rare case, and the ordering
  #   costs ~69 s of latency on EVERY release before the owner is even prompted to approve.
  #
  # Nothing is removed and no gate is weakened: both jobs still run on the release SHA, and
  # `deploy` still requires BOTH via `needs: [preflight, verify, e2e]`, so a `verify` failure
  # still blocks the deployment exactly as before. This is purely the removal of an ordering
  # constraint that carries no data: this job consumes nothing from `verify` — it checks out,
  # installs, generates the client and runs the suite from scratch. The only cost is that a
  # release whose `verify` fails now also spends e2e's runner time, which is the correct trade
  # on a lane where that outcome is rare and the latency is paid every time.
  e2e:
    name: E2E (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [preflight]
    if: needs.preflight.outputs.action == 'release'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eslammuatamed
          POSTGRES_PASSWORD: eslammuatamed
          POSTGRES_DB: eslammuatamed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eslammuatamed"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: '3001'
      DATABASE_URL: postgresql://eslammuatamed:eslammuatamed@localhost:5432/eslammuatamed_test
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: ci-access-secret-that-is-at-least-32-chars
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: '7'
      REFRESH_TOKEN_PEPPER: ci-refresh-pepper-16
      PREVIEW_TOKEN_SECRET: ci-preview-secret-16
      SEED_OWNER_EMAIL: owner@example.com
      SEED_OWNER_PASSWORD: change-me-minimum-12
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: ./storage
      PUBLIC_MEDIA_URL: http://localhost:3001/media
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # No migrate/seed step: the e2e harness owns its own per-run database. See the same
      # note in ci.yml — one setup owner, not two competing ones.
      - name: E2E tests
        run: npm run test:e2e

  deploy:
    name: Build · Ship · Migrate · Cut over
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PRODUCTION APPROVAL GATE. This is the ONLY job in this workflow that
    # mutates the server, and it is bound in full: a job that references an environment
    # does not start until every protection rule of that environment passes, so the
    # required-reviewer approval lands BEFORE the first remote write ("Ship the tarball",
    # scp). Everything upstream is free to run unapproved: preflight is remote READ-ONLY
    # (one `readlink` of the release symlink) and verify/e2e are local verification, so
    # cheap checks still fail fast without spending the owner's attention.
    #
    # The `production` environment carries the repository owner as a required reviewer,
    # prevent-self-review OFF (solo-owner release flow: the owner both triggers and
    # approves), administrator bypass DISALLOWED, and a deployment branch policy of `main`
    # only. Every production path converges on a run whose GITHUB_REF is refs/heads/main:
    # push->main directly, and the merged-PR fallback because deploy-fallback.yml
    # dispatches `deploy.yml --ref main`. Manual workflow_dispatch from any other ref is
    # rejected twice over — by the preflight ref check and by the branch policy.
    environment: production
    # Cannot start unless preflight decided `release` AND both verification jobs of THIS run
    # (same github.sha) pass.
    needs: [preflight, verify, e2e]
    if: needs.preflight.outputs.action == 'release'
    steps:
      - uses: actions/checkout@v7
        id: checkout

      - name: Confirm checked-out HEAD == github.sha
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          [ "$HEAD_SHA" = "$SHA" ] || { echo "::error::HEAD ($HEAD_SHA) != github.sha ($SHA)"; exit 1; }
          echo "Building exact SHA $SHA."

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Compute release id (UTC timestamp + short SHA)
        run: echo "RELEASE=$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Prune to production dependencies
        run: npm prune --omit=dev

      # No second `prisma generate` here. Under Prisma 7 the client is generated as TypeScript
      # into `src/generated/prisma` and compiled by `nest build` into `dist/generated/prisma`
      # (CommonJS), so the artifact that ships already contains it — the tested build is the
      # build that runs. A post-prune regenerate wrote TS back into `src/`, which this tarball
      # does not package, leaving `dist` byte-identical: proven dead work, removed.
      #
      # `prisma.config.ts` IS packaged: Prisma 7 takes the datasource URL from the config file,
      # so `prisma migrate deploy` below exits 1 with "The datasource.url property is required
      # in your Prisma config file" without it. The pruned tree loads that .ts config
      # unaided — @prisma/config bundles its own loader, so no ts-node is required.
      #
      # `dist-ops` IS packaged: it holds the COMPILED governed operator entrypoints — the
      # production seed (doc 09 §6) and the content-synchronization CLI (doc 09 §6.2, doc 23 §4).
      # Both used to run through `ts-node` against `prisma/*.ts` files that import `../src/…`;
      # from a pruned release that is `ts-node` ENOENT and a missing `src/`.
      # `npm run build` emits it, so it is the same code the gates tested.
      - name: Package release tarball
        run: tar -czf "eslammuatamed-api-${RELEASE}.tar.gz" dist dist-ops node_modules prisma prisma.config.ts package.json package-lock.json

      - name: Write deploy key and pin the host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "DEPLOY_KNOWN_HOSTS secret is empty" >&2; exit 1; }
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      # Final exact-SHA re-check immediately before any server mutation (owner policy):
      # main may have moved during verify/e2e; if so, abort without touching the server —
      # the newer commit is deployed by its own event.
      - name: Re-check github.sha is still current main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Git-backend lookup with retries (not REST — see the preflight comment).
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          MAIN=""
          for attempt in 1 2 3 4 5; do
            if MAIN="$(git -c http.extraHeader="$AUTH" ls-remote "https://github.com/${REPO}.git" refs/heads/main 2>/dev/null | cut -f1)" && [ -n "$MAIN" ]; then
              break
            fi
            echo "main-tip lookup attempt $attempt failed; retrying in $((attempt * 5))s..."
            sleep "$((attempt * 5))"
          done
          if [ -z "$MAIN" ]; then
            echo "::error::could not resolve the current main tip; refusing to cut over blind."
            exit 1
          fi
          if [ "$MAIN" != "$SHA" ]; then
            echo "::warning::main moved to $MAIN since preflight; aborting cutover (superseded)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ship the tarball
        id: ship
        if: steps.gate.outputs.proceed == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          TARBALL="eslammuatamed-api-${RELEASE}.tar.gz"
          scp -i "$HOME/.ssh/deploy_key" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$TARBALL" "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/${TARBALL}"

      # The remote half lives in `scripts/deploy/remote-cutover.sh` and is piped over stdin,
      # so the cutover logic is reviewable in the diff and covered by unit tests
      # (`scripts/deploy/remote-cutover.spec.ts`) instead of being an untested heredoc.
      #
      # Its verification gate is liveness AND readiness AND two DB-backed smoke endpoints
      # (2026-08-14: a liveness-only gate passed a release with no database connection and,
      # because auto-rollback hangs off that same gate, left the rollback disarmed). The
      # rollback target is re-verified with the identical checks.
      - name: Extract, migrate, cut over, verify, prune
        id: cutover
        if: steps.gate.outputs.proceed == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          # `tee` keeps the remote output in the job log while letting us inspect it for the
          # prune marker. pipefail is on, so a failed cutover still fails this step.
          ssh -i "$HOME/.ssh/deploy_key" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$RELEASE" \
            < scripts/deploy/remote-cutover.sh | tee /tmp/cutover.log

          # Pruning superseded releases is cleanup that runs AFTER the release is verified
          # healthy, so it must not turn a good deployment red — but it must not be silent
          # either. Anything the server could not remove is named here as a warning and
          # carried into the summary.
          if grep -q '^PRUNE_INCOMPLETE:' /tmp/cutover.log; then
            DIRS="$(grep '^PRUNE_INCOMPLETE:' /tmp/cutover.log | head -1 | cut -d: -f2-)"
            echo "prune_incomplete=true" >> "$GITHUB_OUTPUT"
            echo "prune_dirs=$DIRS" >> "$GITHUB_OUTPUT"
            echo "::warning::Release pruning could not remove:$DIRS — the cutover and its health verification passed; this is cleanup only. Remove the directory out of band (it predates the deploy user)."
          else
            echo "prune_incomplete=false" >> "$GITHUB_OUTPUT"
          fi

      # Observability only — renders what the recorded outcomes can prove. The
      # classification lives in scripts/deploy/deploy-summary.sh (covered by
      # deploy-summary.spec.ts) because a heredoc here cannot be tested: an absent
      # step output usually means the step never ran, so it is not evidence about
      # what happened. No deployment decision reads this summary.
      #
      # Checkout is the FIRST repository-dependent step: if it failed there is no
      # repository tree, so the classifier file itself may not exist. The fallback
      # branch below therefore renders inline from recorded state alone — it must not
      # reference scripts/ — and can state only what is provable then: the run failed
      # before preparation completed, and no server mutation occurred (the first
      # server write is scp, gated on a gate outcome that could never have succeeded).
      - name: Deploy summary (observability)
        if: always()
        env:
          TRIGGER: ${{ needs.preflight.outputs.trigger }}
          SHA: ${{ github.sha }}
          RELEASE_ID: ${{ env.RELEASE }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          PROCEED: ${{ steps.gate.outputs.proceed }}
          SHIP_OUTCOME: ${{ steps.ship.outcome }}
          CUTOVER_OUTCOME: ${{ steps.cutover.outcome }}
          PRUNE_INCOMPLETE: ${{ steps.cutover.outputs.prune_incomplete }}
          PRUNE_DIRS: ${{ steps.cutover.outputs.prune_dirs }}
        run: |
          if [ "${CHECKOUT_OUTCOME:-}" != "success" ]; then
            {
              echo "### Deploy result"
              echo "- trigger: \`${TRIGGER:-}\`"
              echo "- target SHA: \`${SHA:-}\`"
              echo "- release id: \`${RELEASE_ID:-<none>}\`"
              echo "- result: **FAILED** before deployment preparation / exact-SHA decision completed (checkout outcome: \`${CHECKOUT_OUTCOME:-<unset>}\`); no server mutation"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            bash scripts/deploy/deploy-summary.sh >> "$GITHUB_STEP_SUMMARY"
          fi
