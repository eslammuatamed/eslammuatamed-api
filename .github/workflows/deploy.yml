# Production deploy — NestJS API → Contabo VPS (doc 23 §3 "API release").
#
# TRIGGER (owner policy): automatic deployment from `main`.
#   on: push -> main      : a merged dev->main promotion (or authorized push) is
#                           re-verified at the EXACT merged SHA, then deployed.
#   on: workflow_dispatch : recovery / manual redeploy (must run on main; see guard).
# There is no tag trigger and no manual approval gate (GitHub environment required
# reviewers are unavailable on the Free/private plan — enforcement is procedural).
#
# EXACT-SHA GATING: the `deploy` job `needs: [verify, e2e]` from THIS run, so it cannot
# start unless lint/typecheck/unit/contract AND the Postgres e2e suite pass for the same
# `github.sha`. It does not rely on checks that ran on the PR before the merge. Before any
# server mutation the job asserts `github.ref == refs/heads/main` and that the checked-out
# HEAD equals `github.sha`. No path filters — every main commit is fully gated; a
# `[skip ci]` message in a main commit must never be used (it would skip this workflow;
# recover with workflow_dispatch on main — see the runbook).
#
# ROLLBACK (no rebuild — doc 23 §3): on the VPS, repoint `current` at the previous
# release and restart:
#     ln -sfn /srv/eslammuatamed-api/releases/<previous> /srv/eslammuatamed-api/current.new
#     mv -Tf  /srv/eslammuatamed-api/current.new /srv/eslammuatamed-api/current
#     sudo systemctl restart eslammuatamed-api
#   Migrations are fix-forward (doc 09 §6): rolling the symlink back does NOT roll the
#   schema back. Database restore (doc 23 §4) is the disaster path only.
#
# DEVIATION from doc 23 §3: "the release attaches openapi.json" (doc 17 §4) is not yet
# implemented — a deliberate follow-up, outside this deployment-trigger policy change.
#
# SERVER LAYOUT this workflow deploys into (full contract in the deploy runbook):
#   /srv/eslammuatamed-api/releases/<id>   extracted release (dist, node_modules, prisma)
#   /srv/eslammuatamed-api/shared/.env     secrets, server-side only — never in a release
#   /srv/eslammuatamed-api/current         symlink → the live release
#   systemd unit: eslammuatamed-api  (EnvironmentFile=…/shared/.env, ExecStart=node dist/main.js)
#   deploy user needs: authorized_keys (DEPLOY_SSH_KEY public half) + a scoped sudoers
#   rule for exactly `systemctl restart eslammuatamed-api`.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deployment at a time; an in-flight deploy must finish (never cancel a
# cutover). Scoped to this repo's production pipeline.
concurrency:
  group: deploy-api-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Release gate — mirrors ci.yml `verify`. ci.yml is not `workflow_call`-able, so the
  # gates are duplicated here rather than reused, so the deploy is gated on THIS run's
  # verification of the exact main SHA (not only the pre-merge PR checks).
  verify:
    name: Lint · Typecheck · Unit · Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Export OpenAPI contract (no database)
        # Boot validation (doc 07 §3) needs a valid env even though no DB is touched;
        # .env.example is the canonical valid development environment.
        run: cp .env.example .env && npm run contract:export

      - name: Enforce OpenAPI contract idempotence
        # The committed openapi.json must be a fixed point of contract:export (doc 16 §3).
        # Content-level compare (git's --exit-status stat cache false-positives after the
        # rewrite); a drifted contract fails here before anything is deployed.
        run: |
          if git show HEAD:openapi.json | diff -u - openapi.json; then
            echo "openapi.json is a fixed point of contract:export."
          else
            echo "::error::Committed openapi.json is stale — run 'npm run contract:export' and commit the result." >&2
            exit 1
          fi

  # Integration gate — Postgres 16 + migrations + seed + the e2e suite against the exact
  # main SHA (owner policy: main verification must include PostgreSQL E2E).
  e2e:
    name: E2E (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eslammuatamed
          POSTGRES_PASSWORD: eslammuatamed
          POSTGRES_DB: eslammuatamed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eslammuatamed"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: '3001'
      DATABASE_URL: postgresql://eslammuatamed:eslammuatamed@localhost:5432/eslammuatamed_test
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: ci-access-secret-that-is-at-least-32-chars
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: '7'
      REFRESH_TOKEN_PEPPER: ci-refresh-pepper-16
      PREVIEW_TOKEN_SECRET: ci-preview-secret-16
      SEED_OWNER_EMAIL: owner@example.com
      SEED_OWNER_PASSWORD: change-me-minimum-12
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: ./storage
      PUBLIC_MEDIA_URL: http://localhost:3001/media
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed
        run: npm run db:seed

      - name: E2E tests
        run: npm run test:e2e

  deploy:
    name: Build · Ship · Migrate · Cut over
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gate: cannot start unless BOTH verification jobs of THIS run (same github.sha) pass.
    needs: [verify, e2e]
    # Production is main only. A workflow_dispatch on any other ref skips the deploy job
    # entirely (verify/e2e still run harmlessly); a push only ever carries refs/heads/main.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # Exact-SHA guard (owner policy): prove we are on main and that the checked-out tree
      # is exactly github.sha before any server mutation. Fails loudly otherwise.
      - name: Verify production ref and pin the exact SHA
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "event=$EVENT_NAME ref=$REF github.sha=$SHA"
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Refusing to deploy: ref '$REF' is not refs/heads/main." >&2
            exit 1
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$SHA" ]; then
            echo "::error::Checked-out HEAD ($HEAD_SHA) != github.sha ($SHA); aborting." >&2
            exit 1
          fi
          echo "Deploying main at exact SHA $SHA (HEAD verified)."
          echo "✅ Deploying \`main\` at exact SHA \`$SHA\`." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Compute release id (UTC timestamp + short SHA)
        run: echo "RELEASE=$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - run: npm ci

      # Generate before build: the build type-checks against the generated client.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      # Prune dev deps for a lean runtime. The `prisma` CLI survives — it is a peer
      # dependency of `@prisma/client` (a prod dep), so `prisma migrate deploy` runs
      # hermetically on the server with the version-matched CLI (no skew).
      - name: Prune to production dependencies
        run: npm prune --omit=dev

      # Regenerate AFTER the prune. The generated client under node_modules/.prisma is
      # build output, not a tracked package, so the prune's guarantees do not cover it;
      # regenerating (the CLI is present) makes a client-less artifact impossible.
      - name: Regenerate Prisma client into the pruned tree
        run: npx prisma generate

      # Release tarball — code + prod deps + the schema/migrations prisma migrate deploy
      # needs. Deliberately excludes .env: secrets live only in the server's shared/.env.
      - name: Package release tarball
        run: tar -czf "eslammuatamed-api-${RELEASE}.tar.gz" dist node_modules prisma package.json package-lock.json

      - name: Write deploy key and pin the host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # Host key pinned from the DEPLOY_KNOWN_HOSTS secret (runbook B6: ssh-keyscan -H
          # output captured at provisioning). No trust-on-first-use: a MITM or a re-keyed
          # server fails host verification here instead of being silently trusted. Fail
          # loudly if the secret is missing rather than writing an empty known_hosts.
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "DEPLOY_KNOWN_HOSTS secret is empty" >&2; exit 1; }
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Ship the tarball
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          TARBALL="eslammuatamed-api-${RELEASE}.tar.gz"
          scp -i "$HOME/.ssh/deploy_key" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$TARBALL" "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/${TARBALL}"

      - name: Extract, migrate, cut over, health-gate, prune
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          # RELEASE has no shell-special characters (timestamp + hex SHA), so it is safe
          # to pass as a positional arg into the quoted (non-expanding) remote heredoc.
          ssh -i "$HOME/.ssh/deploy_key" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$RELEASE" <<'REMOTE'
          set -euo pipefail
          RELEASE="$1"
          BASE=/srv/eslammuatamed-api
          REL_DIR="$BASE/releases/$RELEASE"
          TARBALL="/tmp/eslammuatamed-api-${RELEASE}.tar.gz"

          # Capture the currently-live release up front so an unhealthy new release can be
          # auto-rolled-back (symlink only — migrations are fix-forward, doc 09 §6).
          PREV="$(readlink -f "$BASE/current" 2>/dev/null || true)"

          # 1. Extract the release (self-contained; carries no secrets).
          mkdir -p "$REL_DIR"
          tar -xzf "$TARBALL" -C "$REL_DIR"
          rm -f "$TARBALL"

          # 2. Pre-deploy migration (doc 23 §3) with the shared env, from the new release.
          #    Fix-forward only (doc 09 §6): a bad migration is repaired by a new one.
          set -a
          . "$BASE/shared/.env"
          set +a
          ( cd "$REL_DIR" && npx prisma migrate deploy )

          # 3. Atomic cut over: build the new symlink beside `current`, then rename over it
          #    (mv -T is atomic; a bare `ln -sfn` is unlink-then-symlink, briefly dangling).
          ln -sfn "$REL_DIR" "$BASE/current.new"
          mv -Tf "$BASE/current.new" "$BASE/current"

          # 4. Restart via the scoped sudoers rule (systemctl restart eslammuatamed-api only).
          sudo systemctl restart eslammuatamed-api

          # 5. Health gate with AUTOMATIC application rollback (owner policy). Liveness is
          #    public/no-DB; --retry-connrefused rides out the boot window. On failure,
          #    repoint `current` at the previous release and restart — the schema is left
          #    as-is (fix-forward, doc 09 §6; never a destructive DB rollback).
          if curl --fail --retry 5 --retry-delay 3 --retry-connrefused --max-time 10 \
               http://127.0.0.1:3001/api/v1/health; then
            echo "Health gate passed for release $RELEASE."
          else
            echo "Health gate FAILED for $RELEASE — rolling the application back." >&2
            if [ -n "$PREV" ] && [ -d "$PREV" ] && [ "$PREV" != "$REL_DIR" ]; then
              ln -sfn "$PREV" "$BASE/current.new"
              mv -Tf "$BASE/current.new" "$BASE/current"
              sudo systemctl restart eslammuatamed-api
              if curl --fail --retry 5 --retry-delay 3 --retry-connrefused --max-time 10 \
                   http://127.0.0.1:3001/api/v1/health; then
                echo "Rolled back to previous release ($PREV); it is healthy." >&2
              else
                echo "Rolled back to $PREV but health still failing — MANUAL INTERVENTION REQUIRED." >&2
              fi
            else
              echo "No previous healthy release to roll back to — MANUAL INTERVENTION REQUIRED." >&2
            fi
            exit 1
          fi

          # 6. Keep the last 5 releases (the live one is newest, so always retained).
          #    Only reached on a healthy deploy — a rolled-back run exits above.
          cd "$BASE/releases"
          ls -1dt */ | tail -n +6 | xargs -r rm -rf
          REMOTE
