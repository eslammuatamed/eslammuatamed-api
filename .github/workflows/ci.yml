name: CI

# Verification only — never deploys (production deploy lives in deploy.yml, on push to main).
# Events (branch policy: dev = integration, main = production):
#   - pull_request -> dev or main : full verification of the proposed merge
#   - push         -> dev         : verification of the integration branch
# main is deliberately NOT a push trigger here: a push to main is handled by deploy.yml,
# which re-runs the same verification against the exact merged SHA before deploying. No
# path filters — every change to these branches is fully verified (no accidental skips).
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Advisory branch-policy guard. It REPORTS an unexpected promotion path; it does not block one.
  #
  # This guard stays advisory by design, not by account-plan limitation. `dev` carries no
  # required checks so D17-4's post-release direct fast-forward remains possible; `main` has
  # structural ruleset enforcement. The live ruleset owns exact settings and check names;
  # CONTRIBUTING.md owns the stable enforced/procedural split.
  policy:
    name: Branch-policy guard (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check promotion path
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "PR promotion path: '$HEAD' -> '$BASE'"
          ok=1
          case "$BASE" in
            dev)
              case "$HEAD" in
                feature/*|fix/*|chore/*|hotfix/*|dependabot/*|renovate/*) ok=0 ;;
              esac ;;
            main)
              case "$HEAD" in
                dev|hotfix/*) ok=0 ;;
              esac ;;
          esac
          if [ "$ok" -eq 0 ]; then
            echo "✅ Allowed promotion path: '$HEAD' -> '$BASE'." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Branch policy::Unexpected promotion path '$HEAD' -> '$BASE'. Expected feature/*|fix/*|chore/* -> dev, and dev|hotfix/* -> main. ADVISORY only — this guard never blocks a merge; enforcement on main is structural, via the repository ruleset."
            {
              echo "### ⚠️ Branch-policy advisory"
              echo "Unexpected promotion path: \`$HEAD\` -> \`$BASE\`."
              echo ""
              echo "- PRs to \`dev\` should originate from \`feature/*\`, \`fix/*\`, \`chore/*\` (or \`hotfix/*\` back-merges / bot branches)."
              echo "- PRs to \`main\` should originate from \`dev\` or \`hotfix/*\`."
              echo ""
              echo "_Advisory only — this guard never fails the build. Enforcement on main is structural (repository ruleset: PR required, merge-commit only, required checks); dev is procedural by design._"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Advisory: never fail the build on a policy mismatch.
          exit 0

  # Fast lane — runs with no database (constitution rule 4). Prisma connects lazily, so
  # typecheck, unit tests, and the contract export all boot the app graph without Postgres.
  verify:
    name: Lint · Typecheck · Unit · Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # `remote-cutover.sh` is production-critical: it runs the migration, the atomic
      # cutover, the health gate and the rollback. Its regression spec also lints it, but
      # only opportunistically — when the binary is absent that test warns and still passes,
      # so a runner-image change could drop the check without anything turning red. This is
      # the authoritative gate. `command -v` first so a missing binary fails with a clear
      # message instead of a bare exit 127. Severity matches the spec's `-S warning`, which
      # the script is already proven clean against.
      - name: ShellCheck deploy scripts
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null || {
            echo "::error::shellcheck is not available on this runner — the deploy-script lint gate cannot run. Install it explicitly rather than skipping."
            exit 1
          }
          shellcheck --severity=warning scripts/deploy/remote-cutover.sh
          echo "shellcheck clean: scripts/deploy/remote-cutover.sh"

      - name: FTS migration guard (protects article search — D09-6/D02-3)
        run: npm run guard:fts

      - name: Unit tests
        run: npm test

      - name: Export OpenAPI contract (no database)
        # Boot validation (doc 07 §3) needs a valid env even though no DB is touched;
        # .env.example is the canonical valid development environment.
        run: cp .env.example .env && npm run contract:export

      - name: Enforce OpenAPI contract idempotence
        # The committed openapi.json must be a fixed point of contract:export (doc 16 §3).
        # Compare the committed blob against the freshly-exported file at the content level
        # (git's --exit-status stat cache false-positives after the rewrite). Drift — an
        # entity changed without regenerating the contract — fails here.
        run: |
          if git show HEAD:openapi.json | diff -u - openapi.json; then
            echo "openapi.json is a fixed point of contract:export."
          else
            echo "::error::Committed openapi.json is stale — run 'npm run contract:export' and commit the result." >&2
            exit 1
          fi

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

      # Dependency-advisory gate (doc 19 §7). PROMOTED TO BLOCKING: the precondition this step's
      # own comment set — "once the baseline is clean" — was met by the audit that measured
      # `npm audit` at 0 vulnerabilities in both scopes (and 0 with `--omit=dev`) from a fresh
      # `npm ci`. An advisory-only gate on a clean baseline reports nothing it would not also
      # report while blocking, so leaving it soft only preserved the ability to miss the first
      # regression. It HAS now been exercised by real Actions runs: green on ci.yml run
      # 31839076806 (2026-08-15) and on every PR run since the billing block was resolved on
      # 2026-08-12. `deploy.yml`'s verify job deliberately omits it: an advisory can land between
      # the dev run and the release, so tree equivalence cannot carry it forward — that makes it a
      # security-cadence question, answered by the weekly CodeQL/alert surface, not a release gate.
      - name: Audit dependencies (high)
        run: npm audit --audit-level=high

  # Integration lane — spins up Postgres 16 and runs migrations, seed, and the e2e suite.
  e2e:
    name: E2E (Postgres)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eslammuatamed
          POSTGRES_PASSWORD: eslammuatamed
          POSTGRES_DB: eslammuatamed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eslammuatamed"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: '3001'
      DATABASE_URL: postgresql://eslammuatamed:eslammuatamed@localhost:5432/eslammuatamed_test
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: ci-access-secret-that-is-at-least-32-chars
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: '7'
      REFRESH_TOKEN_PEPPER: ci-refresh-pepper-16
      PREVIEW_TOKEN_SECRET: ci-preview-secret-16
      SEED_OWNER_EMAIL: owner@example.com
      SEED_OWNER_PASSWORD: change-me-minimum-12
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: ./storage
      PUBLIC_MEDIA_URL: http://localhost:3001/media
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # No migrate/seed step: the e2e harness creates, migrates, seeds and drops its own database
      # per run (D18-8). DATABASE_URL above still matters — the harness derives the SERVER from it
      # and discards its database pathname — but nothing here provisions `eslammuatamed_test`, so
      # there is exactly one setup owner.
      - name: E2E tests
        run: npm run test:e2e
